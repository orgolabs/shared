<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="orgolabs logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="0.55" stop-color="#10b981"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- rounded-square tile -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#sheen)"/>

  <!-- benzene ring + aromatic circle + atom nodes -->
  <g fill="none" stroke="#ffffff" stroke-width="22" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="256,116 377.2,186 377.2,326 256,396 134.8,326 134.8,186"/>
    <circle cx="256" cy="256" r="76" stroke-width="18"/>
    <!-- a substituent bond, to read clearly as a molecule -->
    <line x1="256" y1="116" x2="256" y2="58"/>
  </g>
  <g fill="#ffffff">
    <circle cx="256" cy="116" r="21"/>
    <circle cx="377.2" cy="186" r="21"/>
    <circle cx="377.2" cy="326" r="21"/>
    <circle cx="256" cy="396" r="21"/>
    <circle cx="134.8" cy="326" r="21"/>
    <circle cx="134.8" cy="186" r="21"/>
    <circle cx="256" cy="58" r="18"/>
  </g>
</svg>
